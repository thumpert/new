# Fly.io, chosen because this app needs two things a serverless platform does
# not give it: a process that keeps running after the response — the writing
# and the drawing are both started and then left to finish on their own — and
# a disk that keeps what it wrote, because an order is a JSON file and a page
# is an image beside it.

app = 'portintim'
primary_region = 'gru'

[build]

[env]
  PORT = '3000'

# EXACTLY ONE MACHINE, and that is a correctness requirement rather than a way
# to save money. Storage here is a plain filesystem with no replication, so a
# second machine would come up with its own empty volume and serve a different
# set of orders: a customer would create a book on one and be told it does not
# exist on the next request. Fly's own advice to run two volumes for
# availability does not apply until orders and images move to shared storage.
#
# Enforce it after the first deploy with:  fly scale count 1
#
# WATCH THE DISK AFTER THE SHELF LANDS. An order used to be thirteen images on
# this volume. A colouring book chosen off the shelf is twenty-four, because
# each beat of the story is drawn twice — so the flagship product now costs
# nearly double the disk per order, on a volume that is never garbage
# collected because a customer may come back for their PDF months later.
#
# This does not change an existing volume; `initial_size` only applies to one
# Fly creates. Growing the one already in production is a manual step:
#     fly volumes list
#     fly volumes extend <id> --size 10
[[mounts]]
  source = 'livro_dados'
  destination = '/app/.data'
  initial_size = '10gb'

[http_service]
  internal_port = 3000
  force_https = true
  # Never scale to zero. A machine stopped between requests kills a storyboard
  # half-written — six minutes of work the customer has already paid for.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
  cpus = 2
  memory_mb = 2048
