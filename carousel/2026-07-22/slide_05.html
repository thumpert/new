<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Lora:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; overflow: hidden; background: #0E0E0E; color: #F2ECE0;
      font-family: 'Archivo', sans-serif; padding: 56px 72px 64px; display: flex; flex-direction: column; }
    .meta { display: flex; justify-content: space-between; font-size: 19px; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase; color: #F2ECE0; opacity: .7; }
    .kicker { margin-top: 64px; font-size: 21px; font-weight: 700; letter-spacing: .12em; color: #FF4A1F; }
    .lead { margin-top: 20px; font-family: 'Lora', serif; font-size: 44px; font-weight: 600; line-height: 1.28; }
    .photo { margin: 44px auto 0; width: 100%; height: 480px; border-radius: 6px; overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .close { margin-top: 44px; font-size: 36px; font-weight: 700; line-height: 1.3; }
    .hl { color: #FF4A1F; }
    .spacer { flex: 1; }
  </style>
</head>
<body>
  <div class="meta"><span>@por.tintim</span><span>2026//</span></div>
  <div class="kicker">04 / 05</div>
  <div class="lead">A UE multou a AliExpress em € 550 mi — a <span class="hl">maior penalidade</span> já aplicada sob a Lei de Serviços Digitais europeia.</div>
  <div class="photo"><img src="https://media.beehiiv.com/cdn-cgi/image/fit=scale-down,format=auto,onerror=redirect,quality=80,width=1920,height=3840/uploads/asset/file/defd026c-7255-4945-97bb-f95694c6b36e/GettyImages-2286930522-e1784577541813.jpg?t=1784714460" alt=""></div>
  <div class="close">O processo se junta a outros contra AirBnB, TikTok e Amazon — reguladores europeus <span class="hl">encontrando tom certo</span> para punir gigantes de tech.</div>
  <div class="spacer"></div>
</body>
</html>
