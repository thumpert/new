<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; overflow: hidden; background: #F2ECE0; color: #111;
      font-family: 'Archivo', sans-serif; padding: 56px 72px 64px; display: flex; flex-direction: column; }
    .meta { display: flex; justify-content: space-between; font-size: 19px; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase; color: #111; opacity: .75; }
    .kicker { margin-top: 64px; font-size: 21px; font-weight: 700; letter-spacing: .12em; color: #FF4A1F; }
    .lead { margin-top: 20px; font-size: 42px; font-weight: 700; line-height: 1.28; }
    .photo { margin: 44px auto 0; width: 100%; height: 480px; border-radius: 6px; overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .close { margin-top: 44px; font-size: 36px; font-weight: 700; line-height: 1.3; }
    .hl { color: #FF4A1F; }
    .spacer { flex: 1; }
  </style>
</head>
<body>
  <div class="meta"><span>@por.tintim</span><span>2026//</span></div>
  <div class="kicker">05 / 05</div>
  <div class="lead">A Jusfy, legaltech brasileira, levantou US$ 15 mi numa Série A liderada pela <span class="hl">Thomson Reuters</span>.</div>
  <div class="photo"><img src="https://media.beehiiv.com/cdn-cgi/image/fit=scale-down,format=auto,onerror=redirect,quality=80,width=1920,height=3840/uploads/asset/file/e836351c-ea26-48b6-9a81-749e64ed5700/Jusfy-950x553.jpg?t=1784715191" alt=""></div>
  <div class="close">O aporte financeia expansão da plataforma e sinaliza que <span class="hl">o mercado de legal tech</span> brasileiro está pronto para escala.</div>
  <div class="spacer"></div>
</body>
</html>
