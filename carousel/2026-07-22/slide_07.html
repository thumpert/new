<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1350px; overflow: hidden; background: #0E0E0E; color: #F2ECE0;
      font-family: 'Archivo', sans-serif; padding: 56px 72px; display: flex; flex-direction: column; }
    .meta { display: flex; justify-content: space-between; font-size: 19px; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
    .middle { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 48px; text-align: center; }
    .title { font-family: 'Anton', sans-serif; font-size: 84px; line-height: 1.05; text-transform: uppercase; }
    .hl { color: #FF4A1F; }
    .cta { border: 3px solid #FF4A1F; color: #FF4A1F; font-family: 'Anton', sans-serif;
      font-size: 40px; letter-spacing: .06em; padding: 26px 70px; }
  </style>
</head>
<body>
  <div class="meta"><span>@por.tintim</span><span>2026//</span></div>
  <div class="middle">
    <div class="title">AS MELHORES HISTÓRIAS<br>DAS NEWSLETTERS,<br><span class="hl">TODA SEMANA.</span></div>
    <div class="cta">SIGA @POR.TINTIM →</div>
  </div>
</body>
</html>
